server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy auth service (auth + admin + super-admin APIs)
    location ~ ^/(v1/auth|v1/admin|v1/super-admin)(/.*)?$ {
        set $auth "tgdvg2vs0fnqprpb4n83ihfk:8001";
        proxy_pass http://$auth$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Proxy whatsapp service (accounts + conversations + contacts + webhook)
    location ~ ^/(v1/accounts|v1/conversations|v1/contacts|v1/webhook)(/.*)?$ {
        set $wa "letayexqbb4gs1w8jtxby4nv:8002";
        proxy_pass http://$wa$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
